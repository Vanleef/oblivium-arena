<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PMA · Verificação mobile</title><link rel="stylesheet" href="/styles.css"><style>body.host{min-width:0;padding:16px;font:13px system-ui;background:#090d13}.fixture-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.fixture-tools select{padding:8px;color:#eee;background:#242530}.fixture-note{color:#b3aaa3;font:12px system-ui;margin:12px 0}#frame{width:390px;max-width:100%;height:1000px;display:block;border:1px solid #716249;margin:auto}body.sample{min-width:0;margin:0;padding:12px;background:#0b1118}.sample .app-shell{width:100%;max-width:none}.sample .main-content{padding-top:0}</style></head><body><script type="module">
import {starters,elos} from '/src/data.js';import {createBattle,createEnemyTeam} from '/src/combat.js';import {beginInfluences,chooseInfluence,checkDeathInfluences} from '/src/world-influences.js';import {renderInfluences,renderWorldHistory} from '/src/influence-view.js';import {renderBattle} from '/src/battle-view.js';import {renderArena} from '/src/arena-view.js';
const params=new URLSearchParams(location.search);
if(!params.has('render')){document.body.className='host';document.body.innerHTML=`<div class="fixture-tools"><b>PMA · Verificação mobile</b><label>Tela <select id="screen"><option value="influence">Eventos iniciais</option><option value="battle">Combate</option><option value="death">Escolha após baixa</option><option value="arena">Perfil / Arena</option></select></label><label>Largura <select id="width"><option>390</option><option>320</option><option>360</option><option>480</option><option>768</option><option>1200</option></select></label></div><p class="fixture-note">Cenário isolado de verificação visual. Não lê nem altera seu progresso.</p><iframe id="frame" title="Cenário mobile do PMA"></iframe>`;const frame=document.querySelector('#frame'),screen=document.querySelector('#screen'),width=document.querySelector('#width');function update(){frame.style.width=width.value+'px';frame.src='?render&screen='+screen.value;}screen.addEventListener('change',update);width.addEventListener('change',update);update();}
else{document.body.className='sample';document.body.dataset.tab='battle';const b=createBattle(starters.map(c=>c.id),createEnemyTeam(elos[0],[]),{rng:()=>.1});beginInfluences(b,61);const view=params.get('screen');if(view==='battle'||view==='death'){chooseInfluence(b,b.influenceDraft.options[0]);if(view==='death'){b.allies[0].hp=0;checkDeathInfluences(b);}}const state={battle:b,battleNode:{label:'Confronto de Sangria'},battleFx:null};const draw=()=>document.body.innerHTML=`<div class="app-shell"><main class="main-content">${view==='arena'?renderArena({xp:925},null):b.phase==='influence'?renderInfluences(b):renderWorldHistory(b)+renderBattle(state,elos[0])}</main></div>`;document.body.addEventListener('click',e=>{const card=e.target.closest('[data-world-event]');if(card){chooseInfluence(b,card.dataset.worldEvent);draw();}});draw();}
</script></body></html>
