<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMA — verificação de viewport</title>
<style>
  *{box-sizing:border-box}body{margin:0;padding:16px;background:#080e18;color:#e1ddcf;font:14px system-ui}
  nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  button{min-height:44px;padding:8px 16px;color:inherit;border:1px solid #8e9db0;background:#142132;cursor:pointer}
  button[aria-pressed=true]{border-color:#e2c58d;background:#31415a}
  main{overflow:auto;border:1px solid #52617a;padding:4px;width:100%}
  iframe{display:block;width:320px;height:1100px;border:0;background:#0b1422}
</style>
<nav aria-label="Largura da verificação">
  <b>Viewport da aplicação</b>
  <button type="button" data-width="320" aria-pressed="true">320 px</button>
  <button type="button" data-width="390" aria-pressed="false">390 px</button>
  <button type="button" data-width="768" aria-pressed="false">768 px</button>
  <button type="button" data-width="1200" aria-pressed="false">1200 px</button>
  <output aria-live="polite">320 px</output>
</nav>
<main><iframe title="Aplicação PMA em verificação" src="/" width="320" height="1100"></iframe></main>
<script>
  const frame=document.querySelector('iframe');
  for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{
    const width=Number(button.dataset.width);
    frame.style.width=width+'px';frame.width=String(width);
    for(const item of document.querySelectorAll('[data-width]'))item.setAttribute('aria-pressed',String(item===button));
    document.querySelector('output').textContent=width+' px';
  });
</script>
</html>
