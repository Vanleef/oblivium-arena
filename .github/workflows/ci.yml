name: Testes e build
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/tres-baralhos-confronto-20261107
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Testes do motor de jogo
        run: npm test
      - name: Build estático
        run: npm run build
