name: Testes e build
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/tres-baralhos-confronto-20261107
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes isolados do novo combate
        run: node --test tests/card-combat.test.js tests/tactical-grid.test.js tests/ranked-loadouts.test.js tests/duel-simultaneous.test.js
      - name: Build estático
        if: always()
        run: npm run build
      - name: Regressão completa (inclui testes legados)
        if: always()
        run: npm test
