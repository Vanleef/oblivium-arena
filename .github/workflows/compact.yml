name: Oblivium compact combat

on:
  push:
    branches:
      - art/oblivium-arena-anime-first-20261027
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'api/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/**'
      - '*.css'
      - 'tactical.html'
      - 'package.json'
      - '.github/workflows/compact.yml'

permissions:
  contents: read

jobs:
  compact:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compact regression tests
        run: npm run test:compact
      - name: Authoritative compact PvP protocol tests
        run: node --test tests/compact-pvp.test.js tests/compact-arena-service.test.js tests/tactical-pvp-core.test.js
      - name: Online interface and endpoint smoke
        run: node --check src/compact-online.js && node --check api/arena-compact.js && node --test tests/compact-online-ui.test.js tests/dev-server-compact.test.js tests/online.test.js
      - name: Account and campaign integration regressions
        run: node --test tests/auth-integration-regression.test.js tests/account-service.test.js tests/account-api.test.js tests/campaign-api.test.js tests/campaign-service.test.js
      - name: Tactical and Conquest regressions
        run: node --test tests/tactical-*.test.js tests/tactical-*.test.mjs tests/conquest-*.test.js tests/combat-scenes.test.js
      - name: Complete three compact battles
        run: npm run smoke:compact
      - name: Multi-seed exploratory balance sample
        run: npm run smoke:balance
      - name: Audit animation atlas coverage
        run: npm run audit:animation
      - name: Build static site
        run: npm run build
      - name: Validate committed whitespace
        run: git diff --check HEAD^ HEAD

  full-regression-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run entire existing test suite
        run: npm test
