<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="shadow" x1="147" y1="88" x2="367" y2="413" gradientUnits="userSpaceOnUse">
      <stop stop-color="#393943"/>
      <stop offset=".52" stop-color="#1a1d27"/>
      <stop offset="1" stop-color="#0c1119"/>
    </linearGradient>
    <linearGradient id="rift" x1="202" y1="122" x2="316" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0c1"/>
      <stop offset=".48" stop-color="#dec179"/>
      <stop offset="1" stop-color="#a77d48"/>
    </linearGradient>
    <filter id="softLight" x="135" y="90" width="250" height="330" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="9"/>
