  <!-- An uneven eclipse shadow, without the rim or marks of a dial. -->
  <path d="M251 68c-58 7-107 43-134 98-32 62-31 132 1 189 30 54 79 82 139 113 59-31 109-59 139-113 32-57 33-127 1-189-28-55-77-91-134-98-4 0-8 0-12 0Z"
