<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="face" x1="123" y1="116" x2="387" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a4752"/>
      <stop offset="1" stop-color="#252a35"/>
    </linearGradient>
    <linearGradient id="fracture" x1="326" y1="83" x2="214" y2="399" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0c1"/>
      <stop offset=".52" stop-color="#dcc075"/>
      <stop offset="1" stop-color="#9e764b"/>
    </linearGradient>
  </defs>

  <g transform="translate(-51 -13) scale(1.2 1.05)">
  <!-- A fractured spirit mask: angular, asymmetrical and without a circular frame. -->
  <path d="m263 55 70 33 50 48 24 65-28 49 13 58-38 43-21 49-68 38-58-27-59-26-36-49 12-62-29-48 24-58 39-48 62-31 43-34Z"
        fill="url(#face)" stroke="#07090e" stroke-width="12" stroke-linejoin="round"/>

  <!-- One offset plane makes the face feel split by the veil, not split down its center. -->
  <path d="m321 78-127 326 81 38 68-38 21-49 38-43-13-58 28-49-24-65-50-48-22-14Z"
        fill="#111620" opacity=".9"/>

  <!-- Uneven, recessed eye slits give the mark an anime spirit-mask expression. -->
  <path d="M145 205c24-22 53-28 83-17l-12 26c-23-8-43-4-65 11l-6-20Z" fill="#080b12"/>
  <path d="m300 199 66 10-18 24-43-8-5-26Z" fill="#080b12"/>
  <path d="m318 207 31 5-8 7-23-4v-8Z" fill="#c7aa69"/>

  <!-- A single diagonal tear cuts between the eyes and breaks the face into two planes. -->
  <path d="m321 76 17 9-23 45 17 15-27 41 16 16-31 45 15 16-35 49 11 16-39 54 24-59-10-15 34-48-16-17 29-42-17-16 27-42-17-14 25-47Z"
        fill="#05070c" opacity=".7"/>
  <path d="m317 80 13 7-22 44 17 15-26 40 17 17-30 43 15 16-34 48 11 16-35 47 21-52-10-15 32-46-15-16 27-40-16-16 25-40-16-14 26-44Z"
        fill="url(#fracture)" stroke="#fff0c1" stroke-width="2" stroke-linejoin="bevel"/>
  </g>
</svg>
