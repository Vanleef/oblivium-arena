  <!-- A single flowing opening widens through the center of the torn shadow. -->
  <path d="M309 112c-20 47-42 82-73 112-27 26-54 46-54 62 0 20 35 30 63 48 28 18 48 43 62 77-18-31-39-52-65-68-25-15-58-27-59-48-1-17 29-35 55-62 30-31 54-66 71-121Z"
